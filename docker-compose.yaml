# nginx proxy address - http://172.17.0.1:8000

name: coolify
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: coollabsio/coolify:latest
    container_name: coolify-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      APP_ID: ${APP_ID:-coolify}
      APP_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      APP_URL: http://${BASE_HOST_NAME:-localhost}:8000
      DB_CONNECTION: pgsql
      DB_HOST: coolify-db
      DB_PORT: 5432
      DB_DATABASE: ${DB_CREATE_DATABASE_NAME:-coolify}
      DB_USERNAME: ${DB_USER_NAME:-coolify}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      REDIS_HOST: coolify-redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      MAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      MAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      MAIL_FROM_ADDRESS: ${EMAIL_SERVER_MAIL_FROM:-coolify@example.com}
      CONTAINER_NAME: coolify-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:8000:8000'
    volumes:
      - './volumes/data/coolify:/data/coolify'
      - '/var/run/docker.sock:/var/run/docker.sock'
    depends_on:
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
    networks:
      - coolify
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://coolify-app:8000'
      - 'cloudflare.hostname=coolify.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.coolify-app.entrypoints=http'
      - 'traefik.http.routers.coolify-app-secure.tls=true'
      - 'traefik.http.routers.coolify-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.coolify-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.coolify-app.middlewares=coolify-app-https-redirect'
      - 'traefik.http.routers.coolify-app-secure.entrypoints=https'
      - 'traefik.http.routers.coolify-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.coolify-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.coolify-app-secure.service=coolify-app'
      - 'traefik.http.services.coolify-app.loadbalancer.server.port=8000'

  coolify-db:
    image: postgres:latest
    container_name: coolify-db
    hostname: coolify-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-coolify}
      POSTGRES_USER: ${DB_USER_NAME:-coolify}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: coolify-db
    volumes:
      - './volumes/data/db/postgres/coolify:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - coolify

  coolify-redis:
    image: redis:alpine
    container_name: coolify-redis
    hostname: coolify-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      CONTAINER_NAME: coolify-redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - coolify

networks:
  coolify:
    name: coolify
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
